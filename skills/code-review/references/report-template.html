<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__TITLE__</title>
    <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }

    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: oklch(99% 0.002 240);
      --surface: oklch(100% 0 0);
      --surface-raised: oklch(97% 0.003 240);
      --fg: oklch(18% 0.012 250);
      --fg-secondary: oklch(36% 0.01 250);
      --muted: oklch(54% 0.012 250);
      --border: oklch(92% 0.005 250);
      --border-strong: oklch(86% 0.008 250);

      --critical: oklch(50% 0.19 25);
      --critical-bg: oklch(97% 0.012 25);
      --critical-border: oklch(88% 0.04 25);
      --high: oklch(52% 0.13 60);
      --high-bg: oklch(97% 0.012 60);
      --high-border: oklch(88% 0.04 60);
      --medium: oklch(52% 0.1 90);
      --medium-bg: oklch(97% 0.012 90);
      --medium-border: oklch(88% 0.035 90);
      --low: oklch(50% 0.09 250);
      --low-bg: oklch(97% 0.01 250);
      --low-border: oklch(88% 0.03 250);
      --success: oklch(48% 0.12 155);
      --success-bg: oklch(97% 0.012 155);
      --success-border: oklch(88% 0.04 155);

      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: oklch(14% 0.01 250);
      --surface: oklch(19% 0.01 250);
      --surface-raised: oklch(24% 0.01 250);
      --fg: oklch(94% 0.005 250);
      --fg-secondary: oklch(76% 0.006 250);
      --muted: oklch(56% 0.01 250);
      --border: oklch(28% 0.008 250);
      --border-strong: oklch(36% 0.008 250);

      --critical: oklch(70% 0.2 25);
      --critical-bg: oklch(23% 0.05 25);
      --critical-border: oklch(36% 0.08 25);
      --high: oklch(76% 0.13 60);
      --high-bg: oklch(24% 0.04 60);
      --high-border: oklch(36% 0.06 60);
      --medium: oklch(80% 0.1 90);
      --medium-bg: oklch(24% 0.03 90);
      --medium-border: oklch(36% 0.05 90);
      --low: oklch(72% 0.08 250);
      --low-bg: oklch(22% 0.025 250);
      --low-border: oklch(34% 0.04 250);
      --success: oklch(74% 0.12 155);
      --success-bg: oklch(23% 0.04 155);
      --success-border: oklch(36% 0.06 155);
    }

    html { font-size: 15px; -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 28px;
      padding: 20px 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .header h1 {
      margin-bottom: 8px;
      font-size: 1.3rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .header h1 .branch {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 450;
      color: var(--muted);
      margin-left: 6px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .meta-row .stat {
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--surface-raised);
    }
    .meta-row .additions { color: var(--success); }
    .meta-row .deletions { color: var(--critical); }

    /* ── Verdict (inside header) ── */
    .verdict-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .verdict-label {
      font-size: 0.95rem;
      font-weight: 650;
    }
    .verdict-label.ship { color: var(--success); }
    .verdict-label.fix { color: var(--high); }
    .verdict-label.rethink { color: var(--critical); }
    .verdict-counts {
      display: flex;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .verdict-counts .vc { white-space: nowrap; }
    .verdict-counts .vc.has-count { font-weight: 600; }
    .verdict-counts .vc.critical.has-count { color: var(--critical); }
    .verdict-counts .vc.high.has-count { color: var(--high); }
    .verdict-counts .vc.medium.has-count { color: var(--medium); }
    .verdict-counts .vc.low.has-count { color: var(--low); }

    /* ── Assessment ── */
    .assessment {
      margin-top: 10px;
      color: var(--fg-secondary);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    /* ── Overview ── */
    .overview { margin-bottom: 8px; }
    .overview-card {
      padding: 4px 20px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .overview-item { padding-top: 14px; }
    .overview-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .overview-text {
      color: var(--fg-secondary);
      font-size: 0.88rem;
      line-height: 1.6;
    }
    .risk-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .risk-badge {
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-raised);
    }
    .risk-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .risk-name {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .risk-level {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 7px;
      border: 1px solid;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .risk-notes {
      color: var(--fg-secondary);
      font-size: 0.85rem;
      line-height: 1.55;
    }
    .risk-badge.level-high { border-color: var(--critical-border); }
    .risk-badge.level-high .risk-level { background: var(--critical-bg); color: var(--critical); border-color: var(--critical-border); }
    .risk-badge.level-medium .risk-level { background: var(--medium-bg); color: var(--medium); border-color: var(--medium-border); }
    .risk-badge.level-low .risk-level { background: var(--low-bg); color: var(--low); border-color: var(--low-border); }
    .risk-badge.level-none .risk-level { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }

    /* ── Filter bar ── */
    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      gap: 2px;
      padding: 10px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 550;
      cursor: pointer;
      transition: color 80ms, background 80ms;
    }
    .filter-btn:hover {
      color: var(--fg-secondary);
      background: var(--surface-raised);
    }
    .filter-btn.active {
      color: var(--fg);
      background: var(--surface);
      border-color: var(--border-strong);
    }
    .filter-btn .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.critical { background: var(--critical); }
    .dot.high { background: var(--high); }
    .dot.medium { background: var(--medium); }
    .dot.low { background: var(--low); }

    /* ── Findings ── */
    .findings { margin-bottom: 32px; }
    .section-title {
      padding: 20px 0 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .finding {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      margin-bottom: 6px;
      transition: border-color 80ms;
    }
    .finding:hover { border-color: var(--border-strong); }

    .finding summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      cursor: pointer;
      list-style: none;
      font-size: 0.88rem;
    }
    .finding summary::-webkit-details-marker { display: none; }

    .finding-chevron {
      flex-shrink: 0;
      width: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.6rem;
      transition: transform 80ms;
    }
    .finding[open] .finding-chevron { transform: rotate(90deg); }

    .pill, .tag {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      height: 20px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .pill { padding: 0 7px; border: 1px solid; }
    .pill.critical { background: var(--critical-bg); color: var(--critical); border-color: var(--critical-border); }
    .pill.high { background: var(--high-bg); color: var(--high); border-color: var(--high-border); }
    .pill.medium { background: var(--medium-bg); color: var(--medium); border-color: var(--medium-border); }
    .pill.low { background: var(--low-bg); color: var(--low); border-color: var(--low-border); }
    .tag { padding: 0 6px; background: var(--surface-raised); color: var(--muted); border: 1px solid var(--border); }

    .finding-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 550;
      color: var(--fg);
      line-height: 1.3;
    }
    .file-ref {
      flex-shrink: 0;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
    }

    /* ── Finding body ── */
    .finding-body {
      padding: 2px 14px 14px 36px;
      font-size: 0.87rem;
      line-height: 1.65;
      color: var(--fg-secondary);
    }
    .finding-body > * + * { margin-top: 12px; }

    .finding-suggestion {
      padding: 12px 14px;
      border-radius: 6px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
    }
    .finding-suggestion .suggestion-label {
      margin-bottom: 6px;
      color: var(--success);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .finding-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
    }

    pre {
      margin-top: 10px;
      padding: 12px;
      overflow-x: auto;
      border-radius: 6px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.55;
    }
    code { font-family: var(--font-mono); font-size: 0.86em; }
    :not(pre) > code { padding: 2px 5px; border-radius: 4px; background: var(--surface-raised); }

    /* ── Side quests ── */
    .side-quest .finding { border-style: dashed; opacity: 0.75; }
    .side-quest-label {
      display: inline-block;
      margin-bottom: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--surface-raised);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.68rem;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 200;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 80ms;
    }
    .theme-toggle:hover { border-color: var(--border-strong); color: var(--fg-secondary); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .container { padding: 20px 16px 48px; }
      .header { padding: 16px; }
      .overview-card { padding: 4px 16px 16px; }
      .risk-row { grid-template-columns: 1fr; }
      .verdict-row { flex-direction: column; gap: 6px; }
      .finding summary .tag { display: none; }
      .file-ref { display: none; }
      .finding-title { white-space: normal; }
      .finding-body { padding-left: 14px; }
    }

    @media print {
      :root {
        color-scheme: light;
        --bg: white; --surface: white; --surface-raised: #f6f6f6;
        --fg: #111; --fg-secondary: #444; --muted: #666;
        --border: #ddd; --border-strong: #ccc;
      }
      body { background: white; font-size: 11pt; }
      .container { max-width: 100%; padding: 0; }
      .theme-toggle, .filter-bar { display: none !important; }
      details { break-inside: avoid; }
      details:not([open]) .finding-body { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
    </style>
  </head>
  <body>
    <button
      class="theme-toggle"
      onclick="toggleTheme()"
      aria-label="Toggle theme"
    >
      ◐
    </button>
    __CONTENT__
    <script type="application/json" id="review-data">
    {}
    </script>
    <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute("data-theme");
      html.setAttribute("data-theme", current === "light" ? "dark" : "light");
    }

    function filterFindings(severity, evt) {
      document.querySelectorAll(".filter-btn").forEach((btn) =>
        btn.classList.remove("active")
      );
      evt.target.closest(".filter-btn").classList.add("active");

      document.querySelectorAll(".finding").forEach((el) => {
        el.style.display =
          (severity === "all" || el.dataset.severity === severity)
            ? ""
            : "none";
      });
    }
    </script>
  </body>
</html>
