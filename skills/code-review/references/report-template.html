<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review — {branch-name}</title>
    <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }

    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: oklch(97% 0.006 250);
      --bg-grid: oklch(78% 0.02 250 / 0.45);
      --surface: oklch(100% 0 0 / 0.88);
      --surface-strong: oklch(100% 0 0 / 0.96);
      --surface-raised: oklch(96% 0.006 250 / 0.98);
      --surface-soft: oklch(99% 0.004 250 / 0.72);
      --fg: oklch(18% 0.014 250);
      --fg-secondary: oklch(39% 0.014 250);
      --muted: oklch(55% 0.014 250);
      --border: oklch(88% 0.009 250);
      --border-subtle: oklch(92% 0.007 250);
      --ring: oklch(56% 0.13 250 / 0.22);
      --critical-bg: oklch(96% 0.025 25);
      --critical-border: oklch(84% 0.07 25);
      --high-bg: oklch(96% 0.025 58);
      --high-border: oklch(84% 0.06 58);
      --medium-bg: oklch(96% 0.025 92);
      --medium-border: oklch(86% 0.05 92);
      --low-bg: oklch(96% 0.025 250);
      --low-border: oklch(86% 0.05 250);
      --success-bg: oklch(96% 0.025 155);
      --success-border: oklch(84% 0.06 155);

      --font-body: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --radius-sm: 7px;
      --radius-md: 11px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 14px;
      --space-lg: 22px;
      --space-xl: 34px;
      --space-2xl: 52px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: oklch(13% 0.018 260);
      --bg-grid: oklch(24% 0.02 260 / 0.34);
      --surface: oklch(18% 0.018 260 / 0.88);
      --surface-strong: oklch(21% 0.018 260 / 0.96);
      --surface-raised: oklch(24% 0.018 260 / 0.98);
      --surface-soft: oklch(20% 0.014 260 / 0.58);
      --fg: oklch(94% 0.008 250);
      --fg-secondary: oklch(72% 0.012 250);
      --muted: oklch(55% 0.016 250);
      --border: oklch(31% 0.014 260);
      --border-subtle: oklch(25% 0.012 260);
      --ring: oklch(73% 0.14 250 / 0.3);

      --critical: oklch(68% 0.24 25);
      --critical-bg: oklch(24% 0.07 25);
      --critical-border: oklch(42% 0.12 25);
      --high: oklch(76% 0.17 58);
      --high-bg: oklch(25% 0.055 58);
      --high-border: oklch(42% 0.09 58);
      --medium: oklch(79% 0.14 92);
      --medium-bg: oklch(25% 0.045 92);
      --medium-border: oklch(42% 0.075 92);
      --low: oklch(72% 0.13 250);
      --low-bg: oklch(24% 0.04 250);
      --low-border: oklch(40% 0.07 250);
      --success: oklch(74% 0.17 155);
      --success-bg: oklch(23% 0.055 155);
      --success-border: oklch(40% 0.09 155);
    }

    html { font-size: 15px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      line-height: 1.55;
      color: var(--fg);
      background:
        radial-gradient(circle at 8% -10%, oklch(32% 0.09 250 / 0.34), transparent 32rem),
        radial-gradient(circle at 88% 0%, oklch(30% 0.08 155 / 0.22), transparent 28rem),
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        var(--bg);
      background-size: auto, auto, 38px 38px, 38px 38px, auto;
    }

    .container {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .header {
      position: relative;
      overflow: hidden;
      padding: 24px 26px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--surface-strong), var(--surface-soft));
      backdrop-filter: blur(18px) saturate(1.25);
      box-shadow: 0 24px 80px oklch(0% 0 0 / 0.24);
    }
    .header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, oklch(100% 0 0 / 0.06), transparent);
      transform: translateX(-70%);
    }
    .header h1 {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px 14px;
      margin-bottom: 14px;
      font-size: clamp(1.65rem, 4vw, 2.65rem);
      font-weight: 780;
      line-height: 1.05;
      letter-spacing: -0.055em;
    }
    .header h1 .branch {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 0.46em;
      font-weight: 520;
      letter-spacing: -0.025em;
      color: var(--fg-secondary);
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }
    .meta-row .stat {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: var(--surface-soft);
    }
    .meta-row .additions { color: var(--success); border-color: var(--success-border); background: var(--success-bg); }
    .meta-row .deletions { color: var(--critical); border-color: var(--critical-border); background: var(--critical-bg); }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .dash-card {
      position: relative;
      overflow: hidden;
      min-height: 108px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      backdrop-filter: blur(14px);
    }
    .dash-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--muted);
    }
    .dash-card .count {
      font-family: var(--font-mono);
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 760;
      line-height: 0.95;
      letter-spacing: -0.08em;
      font-variant-numeric: tabular-nums;
    }
    .dash-card .label {
      margin-top: 12px;
      color: var(--fg-secondary);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 680;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .dash-card.critical::before, .dash-card.critical .count { color: var(--critical); background: var(--critical); }
    .dash-card.high::before, .dash-card.high .count { color: var(--high); background: var(--high); }
    .dash-card.medium::before, .dash-card.medium .count { color: var(--medium); background: var(--medium); }
    .dash-card.low::before, .dash-card.low .count { color: var(--low); background: var(--low); }

    .assessment {
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--fg-secondary);
      font-size: 0.94rem;
      backdrop-filter: blur(14px);
    }

    .filter-bar {
      position: sticky;
      top: 10px;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 18px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in oklch, var(--bg) 76%, transparent);
      backdrop-filter: blur(18px) saturate(1.35);
      box-shadow: 0 18px 50px oklch(0% 0 0 / 0.22);
    }
    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 5px 13px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--fg-secondary);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 650;
      cursor: pointer;
      user-select: none;
      transition: 140ms ease;
    }
    .filter-btn:hover { color: var(--fg); background: var(--surface-soft); border-color: var(--border-subtle); }
    .filter-btn.active { color: var(--bg); background: var(--fg); border-color: var(--fg); }
    .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; }
    .dot.critical { background: var(--critical); }
    .dot.high { background: var(--high); }
    .dot.medium { background: var(--medium); }
    .dot.low { background: var(--low); }

    .findings { margin-bottom: 34px; }
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 12px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 760;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .section-title::after { content: ""; height: 1px; flex: 1; background: var(--border-subtle); }

    .finding {
      position: relative;
      overflow: clip;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-strong);
      backdrop-filter: blur(14px);
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
    }
    .finding:hover { border-color: var(--ring); transform: translateY(-1px); }
    .finding::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--muted);
    }
    .finding[data-severity="critical"]::before { background: var(--critical); }
    .finding[data-severity="high"]::before { background: var(--high); }
    .finding[data-severity="medium"]::before { background: var(--medium); }
    .finding[data-severity="low"]::before { background: var(--low); }

    .finding summary {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 14px 16px 14px 20px;
      cursor: pointer;
      list-style: none;
    }
    .finding summary::-webkit-details-marker { display: none; }
    .finding summary::before {
      content: "›";
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      color: var(--muted);
      font-size: 1.05rem;
      transition: transform 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .finding[open] summary::before { transform: rotate(90deg); color: var(--fg); border-color: var(--border); }

    .finding-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--fg);
      font-size: 0.96rem;
      font-weight: 680;
      letter-spacing: -0.018em;
    }
    .file-ref {
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      text-align: right;
    }

    .pill, .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 760;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .pill { padding: 2px 10px; border: 1px solid var(--border); }
    .pill.critical { background: var(--critical-bg); color: var(--critical); border-color: var(--critical-border); }
    .pill.high { background: var(--high-bg); color: var(--high); border-color: var(--high-border); }
    .pill.medium { background: var(--medium-bg); color: var(--medium); border-color: var(--medium-border); }
    .pill.low { background: var(--low-bg); color: var(--low); border-color: var(--low-border); }
    .tag { padding: 2px 9px; border: 1px solid var(--border-subtle); background: var(--surface-raised); color: var(--muted); }

    .finding-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.76fr);
      gap: 14px;
      padding: 0 16px 16px 20px;
      color: var(--fg-secondary);
      font-size: 0.91rem;
    }
    .finding-description,
    .finding-suggestion {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface-soft);
    }
    .finding-description { color: var(--fg-secondary); }
    .finding-suggestion { background: var(--surface-raised); }
    .finding-suggestion .suggestion-label {
      margin-bottom: 8px;
      color: var(--success);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .finding-meta {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
    }
    .finding-meta span {
      padding: 4px 8px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: var(--surface-soft);
    }

    pre {
      margin-top: 10px;
      padding: 12px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.55;
    }
    code { font-family: var(--font-mono); font-size: 0.88em; }
    :not(pre) > code { padding: 1px 5px; border-radius: 5px; background: var(--surface-raised); }

    .side-quest .finding { border-style: dashed; opacity: 0.9; }
    .side-quest-label {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 4px 9px;
      border: 1px dashed var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-soft);
      font-family: var(--font-mono);
      font-size: 0.72rem;
    }

    .verdict {
      margin-top: 34px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--surface-strong);
      text-align: center;
      backdrop-filter: blur(14px);
    }
    .verdict-icon { margin-bottom: 8px; font-size: 2.35rem; line-height: 1; }
    .verdict h2 { margin-bottom: 8px; font-size: 1.45rem; letter-spacing: -0.035em; }
    .verdict p { max-width: 640px; margin: 0 auto; color: var(--fg-secondary); }
    .verdict.ship { border-color: var(--success-border); box-shadow: inset 0 1px 0 var(--success-bg); }
    .verdict.ship h2 { color: var(--success); }
    .verdict.fix { border-color: var(--high-border); box-shadow: inset 0 1px 0 var(--high-bg); }
    .verdict.fix h2 { color: var(--high); }
    .verdict.rethink { border-color: var(--critical-border); box-shadow: inset 0 1px 0 var(--critical-bg); }
    .verdict.rethink h2 { color: var(--critical); }

    .action-table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      text-align: left;
    }
    .action-table th,
    .action-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); }
    .action-table th { color: var(--muted); font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .action-table td { color: var(--fg-secondary); }

    .theme-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--fg-secondary);
      box-shadow: 0 12px 40px oklch(0% 0 0 / 0.25);
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: 140ms ease;
    }
    .theme-toggle:hover { color: var(--fg); border-color: var(--ring); transform: translateY(-1px); }

    @media (max-width: 860px) {
      .container { width: min(100vw - 20px, 1180px); padding-top: 16px; }
      .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .finding summary { grid-template-columns: auto auto minmax(0, 1fr); }
      .finding summary .tag { display: none; }
      .file-ref { grid-column: 3; max-width: 100%; text-align: left; }
      .finding-body { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      html { font-size: 14px; }
      .header { padding: 18px; border-radius: var(--radius-lg); }
      .dashboard { grid-template-columns: 1fr 1fr; }
      .dash-card { min-height: 92px; padding: 14px; }
      .filter-bar { border-radius: var(--radius-lg); }
      .finding summary { padding-right: 12px; }
      .finding-title { white-space: normal; }
      .action-table { display: block; overflow-x: auto; }
    }

    @media print {
      :root {
        color-scheme: light;
        --bg: white; --surface: white; --surface-strong: white; --surface-raised: #f5f5f5; --surface-soft: white;
        --fg: #111; --fg-secondary: #444; --muted: #777; --border: #ddd; --border-subtle: #eee;
      }
      body { background: white; font-size: 11pt; }
      .container { width: 100%; padding: 0; }
      .theme-toggle, .filter-bar { display: none !important; }
      .header, .dash-card, .assessment, .finding, .verdict { box-shadow: none; backdrop-filter: none; break-inside: avoid; }
      details { break-inside: avoid; }
      details:not([open]) .finding-body { display: grid; }
    }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Code Review <span class="branch">→ {branch-name}</span></h1>
      </header>
    </div>
  </body>
</html>
