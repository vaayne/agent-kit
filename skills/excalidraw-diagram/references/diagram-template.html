<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>__TITLE__</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/dist/prod/index.css"
    >
    <style>
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; }
    #status {
      align-items: center;
      background: Canvas;
      color: CanvasText;
      display: flex;
      height: 100%;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    #status.error { color: #b42318; }
    #status p { max-width: 42rem; white-space: pre-wrap; }
    </style>
    <script>
    // Fonts and other Excalidraw assets must come from the same pinned package version.
    window.EXCALIDRAW_ASSET_PATH =
      "https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/dist/prod/";
    </script>
  </head>
  <body>
    <main id="root" aria-live="polite">
      <div id="status">
        <p>Loading editable Excalidraw canvas… Network access is required.</p>
      </div>
    </main>
    <script id="diagram-data" type="application/json">
    "__DIAGRAM_DATA__"
    </script>
    <script type="module">
    const rootElement = document.querySelector("#root");
    const statusElement = document.querySelector("#status");

    function showError(error) {
      statusElement.className = "error";
      statusElement.replaceChildren(
        Object.assign(document.createElement("p"), {
          textContent: `Could not load this diagram.\n${
            error instanceof Error ? error.message : String(error)
          }`,
        }),
      );
    }

    try {
      const diagram = JSON.parse(
        document.querySelector("#diagram-data").textContent,
      );
      if (!Array.isArray(diagram.elements)) {
        throw new Error("Embedded diagram has no elements array.");
      }

      // Dynamic imports keep CDN/network failures inside the useful error state above.
      const [ReactModule, ReactDomModule, ExcalidrawModule] = await Promise.all(
        [
          import("https://esm.sh/react@19.0.0"),
          import("https://esm.sh/react-dom@19.0.0/client"),
          import(
            "https://esm.sh/@excalidraw/excalidraw@0.18.1?deps=react@19.0.0,react-dom@19.0.0"
          ),
        ],
      );
      const React = ReactModule.default;
      const { createRoot } = ReactDomModule;
      const { Excalidraw, convertToExcalidrawElements } = ExcalidrawModule;
      const elements = convertToExcalidrawElements(diagram.elements, {
        regenerateIds: false,
      });
      const appRoot = createRoot(rootElement);

      function DiagramApp() {
        return React.createElement(Excalidraw, {
          initialData: { elements, scrollToContent: true },
          name: diagram.title,
        });
      }

      appRoot.render(React.createElement(DiagramApp));
    } catch (error) {
      showError(error);
    }
    </script>
  </body>
</html>
