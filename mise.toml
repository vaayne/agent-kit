[tools]
dprint = "latest"
gh = "latest"

[tasks.format]
description = "Format code using dprint"
run = "dprint fmt"

[tasks.sync]
description = "Sync components to various local agent frameworks"
depends = ["sync:skills", "sync:agents", "sync:extensions"]

[tasks."sync:extensions"]
description = "Symlink Pi extensions into ~/.pi/agent/extensions"
run = """
EXT_DIR="$HOME/.pi/agent/extensions"
mkdir -p "$EXT_DIR"
for ext in auto-continue-after-compact.ts cliproxy-provider codex-usage-status.ts model-context.ts; do
  ln -sfn "$PWD/extensions/$ext" "$EXT_DIR/$ext"
done
echo "Linked Pi extensions to $EXT_DIR"
"""

[tasks."sync:agents"]
description = "Sync _AGENTS.md to all agent frameworks"
run = """
AGENTS_FILE="$PWD/_AGENTS.md"

link_path() {
  source="$1"
  target="$2"
  allow_directory_replace="${3:-false}"
  mkdir -p "$(dirname "$target")"

  if [ -e "$target" ] || [ -L "$target" ]; then
    if [ -d "$target" ] && [ ! -L "$target" ]; then
      if [ "$allow_directory_replace" != "true" ]; then
        echo "Refusing to replace directory: $target" >&2
        exit 1
      fi
      rm -rf "$target"
    else
      rm -f "$target"
    fi
  fi

  ln -s "$source" "$target"
}

link_path "$AGENTS_FILE" ~/.pi/agent/AGENTS.md
link_path "$AGENTS_FILE" ~/.codex/AGENTS.md
link_path "$AGENTS_FILE" ~/.claude/CLAUDE.md
echo "Linked _AGENTS.md to all frameworks"
"""
