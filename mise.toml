[tools]
dprint = "latest"

[tasks.setup]
description = "Initialize repo (submodules, dependencies)"
run = """
git submodule update --init --recursive
echo "Setup complete"
"""

[tasks.format]
description = "Format code using dprint"
run = "dprint fmt"

[tasks.sync]
description = "Sync components to various local agent frameworks"
depends = ["sync:skills", "sync:agents"]

[tasks."sync:skills"]
description = "Sync all skills (local + remote) to ~/.agents/skills"
depends = ["sync:impeccable"]
run = """
mkdir -p ~/.agents/skills

# Sync Designer
(cd ./skills/designer && bash scripts/sync.sh)

# Sync Tap-web
tap skill install --path ./skills/tap-web

# Copy all skills to shared location (after all sources are populated)
rsync -avL --delete ./skills/ ~/.agents/skills/ --exclude remote-skills.txt

# Install remote skills from registry
if [ -f ./skills/remote-skills.txt ]; then
  while IFS= read -r line; do
    line=$(echo "$line" | sed 's/#.*//' | xargs)
    [ -z "$line" ] && continue
    echo "Installing: mh skills add $line"
    (cd ~ && mh skills add $line)
  done < ./skills/remote-skills.txt
  echo "Remote skills synced"
fi

# Symlink each framework's skills dir to the shared location
for dir in ~/.claude/skills ~/.factory/skills ~/.pi/skills ~/.codex/skills ~/.config/amp/skills; do
  if [ -d "$dir" ] && [ ! -L "$dir" ]; then
    rm -rf "$dir"
  fi
  # mkdir -p "$(dirname "$dir")"
  # ln -sfn ~/.agents/skills "$dir"
done

# link claude skills
ln -sfn ~/.agents/skills ~/.claude/skills

mise run format
echo "Synced all skills to ~/.agents/skills"
"""

[tasks."sync:impeccable"]
description = "Clone/update pbakaus/impeccable and save skills locally"
run = """
REPO_URL="https://github.com/pbakaus/impeccable.git"
CACHE_DIR="$HOME/.cache/impeccable"
SKILL_DIR="$CACHE_DIR/.agents/skills/impeccable"

# Clone or update the repo
if [ -d "$CACHE_DIR/.git" ]; then
  echo "Updating impeccable repo..."
  git -C "$CACHE_DIR" pull --ff-only
else
  echo "Cloning impeccable repo..."
  git clone "$REPO_URL" "$CACHE_DIR"
fi

cp -R $SKILL_DIR ./skills
"""

[tasks."sync:agents"]
description = "Sync _AGENTS.md to all agent frameworks"
run = """
AGENTS_FILE="$PWD/_AGENTS.md"
AGENTS_DIR="$PWD/agents"

link_path() {
  source="$1"
  target="$2"
  allow_directory_replace="${3:-false}"
  mkdir -p "$(dirname "$target")"

  if [ -e "$target" ] || [ -L "$target" ]; then
    if [ -d "$target" ] && [ ! -L "$target" ]; then
      if [ "$allow_directory_replace" != "true" ]; then
        echo "Refusing to replace directory: $target" >&2
        exit 1
      fi
      rm -rf "$target"
    else
      rm -f "$target"
    fi
  fi

  ln -s "$source" "$target"
}

link_path "$AGENTS_FILE" ~/.pi/agent/AGENTS.md
link_path "$AGENTS_FILE" ~/.codex/AGENTS.md
link_path "$AGENTS_FILE" ~/.claude/CLAUDE.md
link_path "$AGENTS_FILE" ~/.factory/AGENTS.md
link_path "$AGENTS_FILE" ~/.config/amp/AGENTS.md
link_path "$AGENTS_DIR" ~/.pi/agent/agents true

echo "Linked _AGENTS.md and agents directory to all frameworks"
"""
