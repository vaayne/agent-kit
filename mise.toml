[tools]
dprint = "latest"
gh = "latest"
python = "3.12"

[tasks.format]
description = "Format code using dprint"
run = "dprint fmt"

[tasks.sync]
description = "Sync local agent configuration, instructions, and skills"
run = """
set -e
mise run format
mise run sync:config
mise run sync:agents
mise run sync:skills
"""

[tasks."sync:agents"]
description = "Sync shared instructions and rules to all agent frameworks"
run = """
set -e
AGENTS_FILE="$PWD/_AGENTS.md"

link_path() {
  source="$1"
  target="$2"
  allow_directory_replace="${3:-false}"
  mkdir -p "$(dirname "$target")"

  if [ -e "$target" ] || [ -L "$target" ]; then
    if [ -d "$target" ] && [ ! -L "$target" ]; then
      if [ "$allow_directory_replace" != "true" ]; then
        echo "Refusing to replace directory: $target" >&2
        exit 1
      fi
      rm -rf "$target"
    else
      rm -f "$target"
    fi
  fi

  ln -s "$source" "$target"
}

link_path "$PWD/rules" ~/.agents/rules
link_path "$AGENTS_FILE" ~/.pi/agent/AGENTS.md
link_path "$AGENTS_FILE" ~/.codex/AGENTS.md
link_path "$AGENTS_FILE" ~/.claude/CLAUDE.md
echo "Linked shared instructions and rules"
"""
