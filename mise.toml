[tools]
dprint = "latest"

[tasks.setup]
description = "Initialize repo (submodules, dependencies)"
run = """
git submodule update --init --recursive
echo "Setup complete"
"""

[tasks.format]
description = "Format code using dprint"
run = "dprint fmt"

[tasks.sync]
description = "Sync components to various local agent frameworks"
depends = ["sync:skills", "sync:agents", "sync:extensions"]

[tasks."sync:extensions"]
description = "Symlink Pi extensions into ~/.pi/agent/extensions"
run = """
EXT_DIR="$HOME/.pi/agent/extensions"
mkdir -p "$EXT_DIR"
# delegate is intentionally not linked: cross-runtime delegation is the delegate *skill*'s job
for ext in cliproxy-provider codex-usage-status.ts model-context.ts notify.ts; do
  ln -sfn "$PWD/extensions/$ext" "$EXT_DIR/$ext"
done
echo "Linked Pi extensions to $EXT_DIR"
"""

[tasks."sync:skills"]
description = "Link local skills and install remote skills to ~/.agents/skills"
# depends = ["sync:impeccable"]
run = """
SKILL_SOURCE_DIR="$PWD/skills"
SHARED_SKILL_DIR="$HOME/.agents/skills"
mkdir -p "$SHARED_SKILL_DIR"

# Refresh generated local skill content before linking it.
(cd "$SKILL_SOURCE_DIR/designer" && bash scripts/sync.sh)
tap skill install --path "$SKILL_SOURCE_DIR/tap-web"

# Remove links for local skills that no longer exist in this repo.
for target in "$SHARED_SKILL_DIR"/*; do
  [ -L "$target" ] || continue
  case "$(readlink "$target")" in
    "$SKILL_SOURCE_DIR"/*)
      [ -e "$(readlink "$target")" ] || rm -f "$target"
      ;;
  esac
done

# Link each local skill individually so remote skills can coexist in the shared directory.
for source in "$SKILL_SOURCE_DIR"/*; do
  [ -d "$source" ] || continue
  target="$SHARED_SKILL_DIR/$(basename "$source")"
  if [ -d "$target" ] && [ ! -L "$target" ]; then
    rm -rf "$target"
  else
    rm -f "$target"
  fi
  ln -s "$source" "$target"
done

# Install remote skills from registry
if [ -f ./skills/remote-skills.txt ]; then
  while IFS= read -r line; do
    line=$(echo "$line" | sed 's/#.*//' | xargs)
    [ -z "$line" ] && continue
    echo "Installing: mh skills add $line"
    (cd ~ && mh skills add $line)
  done < ./skills/remote-skills.txt
  echo "Remote skills synced"
fi

# Symlink each framework's skills dir to the shared location
for dir in ~/.claude/skills ~/.factory/skills ~/.pi/skills ~/.codex/skills ~/.config/amp/skills; do
  if [ -d "$dir" ] && [ ! -L "$dir" ]; then
    rm -rf "$dir"
  fi
  # mkdir -p "$(dirname "$dir")"
  # ln -sfn ~/.agents/skills "$dir"
done

# link claude skills
ln -sfn ~/.agents/skills ~/.claude/skills
ln -sfn ~/.agents/skills ~/.gemini/config/skills

mise run format
echo "Linked local skills and installed remote skills in ~/.agents/skills"
"""

[tasks."sync:impeccable"]
description = "Clone/update pbakaus/impeccable and save skills locally"
run = """
REPO_URL="https://github.com/pbakaus/impeccable.git"
CACHE_DIR="$HOME/.cache/impeccable"
SKILL_DIR="$CACHE_DIR/.agents/skills/impeccable"

# Clone or update the repo
if [ -d "$CACHE_DIR/.git" ]; then
  echo "Updating impeccable repo..."
  git -C "$CACHE_DIR" pull --ff-only
else
  echo "Cloning impeccable repo..."
  git clone "$REPO_URL" "$CACHE_DIR"
fi

cp -R $SKILL_DIR ./skills
"""

[tasks."sync:agents"]
description = "Sync _AGENTS.md to all agent frameworks"
run = """
AGENTS_FILE="$PWD/_AGENTS.md"

link_path() {
  source="$1"
  target="$2"
  allow_directory_replace="${3:-false}"
  mkdir -p "$(dirname "$target")"

  if [ -e "$target" ] || [ -L "$target" ]; then
    if [ -d "$target" ] && [ ! -L "$target" ]; then
      if [ "$allow_directory_replace" != "true" ]; then
        echo "Refusing to replace directory: $target" >&2
        exit 1
      fi
      rm -rf "$target"
    else
      rm -f "$target"
    fi
  fi

  ln -s "$source" "$target"
}

link_path "$AGENTS_FILE" ~/.pi/agent/AGENTS.md
link_path "$AGENTS_FILE" ~/.codex/AGENTS.md
link_path "$AGENTS_FILE" ~/.claude/CLAUDE.md
link_path "$AGENTS_FILE" ~/.factory/AGENTS.md
link_path "$AGENTS_FILE" ~/.config/amp/AGENTS.md
echo "Linked _AGENTS.md to all frameworks"
"""
